[www]
user  = www-data
group = www-data

listen = 9000
listen.backlog = 512

pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500
pm.status_path       = /fpm-status

; Логи в stdout контейнера
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env  = no

; Загрузка меша на сотни мегабайт не должна упираться в таймаут FPM —
; тяжёлая обработка всё равно уходит в очередь, но сам upload должен долетать.
request_terminate_timeout = 300
