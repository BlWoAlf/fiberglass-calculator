[PHP]
; Загрузка мешей: лимиты подняты под файлы из фотограмметрии.
; ${VAR:-default} PHP подставляет из окружения сам, значения — в корневом .env.
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE:-512M}
post_max_size       = ${PHP_POST_MAX_SIZE:-512M}
memory_limit        = ${PHP_MEMORY_LIMIT:-512M}
max_execution_time  = ${PHP_MAX_EXECUTION_TIME:-300}
max_input_time      = 300

expose_php    = Off
date.timezone = ${PHP_TIMEZONE:-UTC}

; Метрики меша — float; отключаем «красивое» округление при выводе,
; иначе в логах и JSON площадь и объём теряют значащие разряды.
serialize_precision = -1
precision = 17

realpath_cache_size = 4096K
realpath_cache_ttl  = 600

[Session]
session.cookie_httponly = 1
session.use_strict_mode = 1
