opcache.enable              = 1
opcache.enable_cli          = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 0
opcache.memory_consumption  = 256
opcache.jit                 = disable

display_errors         = On
display_startup_errors = On
error_reporting        = E_ALL
zend.assertions        = 1

; По умолчанию выключен: на разборе меша в миллион треугольников включённый
; xdebug даёт десятикратное замедление. Включается через XDEBUG_MODE в .env.
xdebug.mode               = ${XDEBUG_MODE:-off}
xdebug.client_host        = ${XDEBUG_CLIENT_HOST:-host.docker.internal}
xdebug.start_with_request = trigger
xdebug.client_port        = 9003
xdebug.idekey             = fiberglass
xdebug.max_nesting_level  = 512
xdebug.log_level          = 0
