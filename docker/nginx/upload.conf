# Меши из фотограмметрии — сотни мегабайт. Лимит держим согласованным
# с upload_max_filesize/post_max_size в PHP.
client_max_body_size 512m;
client_body_timeout  300s;
client_body_buffer_size 1m;

# Буферизация тела на диск: держать полгигабайта в памяти nginx незачем.
client_body_in_file_only off;

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript
           application/wasm image/svg+xml model/gltf+json model/gltf-binary;
gzip_min_length 1024;
