server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Превью-меши: GLB отдаётся статикой, минуя PHP.
    location ~* \.(glb|gltf|drc|bin)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js|mjs|map|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";

        # Загрузка меша идёт одним запросом; обработка уже асинхронная,
        # но сам upload может длиться минуты на медленном канале.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 16 64k;
        fastcgi_buffer_size 128k;

        internal;
    }

    # Прямой доступ к любым другим .php запрещён
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
