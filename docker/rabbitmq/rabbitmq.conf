# Обработка меша занимает минуты — подтверждение задачи не должно
# выбиваться по таймауту консьюмера. 30 минут с запасом.
consumer_timeout = 1800000

# Файлы не ходят через очередь (в сообщении только id модели), поэтому
# лимиты можно держать скромными.
max_message_size = 16777216

vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

log.console = true
log.console.level = info
